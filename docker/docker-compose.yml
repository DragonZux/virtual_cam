# Virtual Cam bằng Docker trên NVIDIA Jetson (JetPack 6) — một container, YOLO chạy trên GPU Jetson:
#   http://localhost:8032      — máy này (localhost được phép mở camera)
#   https://<LAN_IP>:8033      — điện thoại / máy khác cùng mạng (chứng chỉ tự ký, đặt LAN_IP trong .env)
# Máy host không cần cài Python / PyTorch: chỉ cần Docker + NVIDIA container runtime của JetPack.
# Chạy ở thư mục gốc của dự án:
#   docker compose -f docker/docker-compose.yml up -d --build
#   docker compose -f docker/docker-compose.yml logs -f
# Lần chạy đầu container tự tải model còn thiếu vào models/ (xem docker/init_models.py). Đường dẫn dưới đây tính từ thư mục docker/.
name: virtual_cam
services:
  virtual-cam:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: virtual-cam:latest
    container_name: virtual-cam
    # GPU Jetson qua NVIDIA container runtime (không dùng deploy.resources.devices như máy x86)
    runtime: nvidia
    ipc: host
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: all
      # Hiện ở Cài đặt › Dùng trên thiết bị khác và ghi vào chứng chỉ HTTPS
      PUBLIC_URLS: ${LAN_IP:+https://${LAN_IP}:${LAN_HTTPS_PORT:-8033}}
      # Cạnh ảnh đưa vào YOLO (640 chính xác nhất; 480 / 320 nhanh hơn)
      IMAGE_SIZE: ${IMAGE_SIZE:-640}
      LASER_MODEL: ${LASER_MODEL:-laser-advr-yolov5l6.torchscript}
      LASER_IMAGE_SIZE: ${LASER_IMAGE_SIZE:-1280}
      LASER_CONFIDENCE: ${LASER_CONFIDENCE:-0.55}
      LASER_CROP_SIZE: ${LASER_CROP_SIZE:-384}
      # Model YOLO (file trong models/)
      YOLO_MODEL: ${YOLO_MODEL:-yolo26m-seg.pt}
      # Ảnh / video tải lên lưu vào thư mục của máy host
      UPLOAD_DIR: /data/uploads
      UPLOAD_DIR_DISPLAY: ${UPLOAD_HOST_DIR:-uploads}
    ports:
      # HTTP chỉ cho chính máy này: cổng này được quản lý mô hình (MODEL_ADMIN=local); máy khác dùng HTTPS bên dưới
      - "127.0.0.1:${WEB_PORT:-8032}:8030"
      - "0.0.0.0:${LAN_HTTPS_PORT:-8033}:8031"
    volumes:
      # models/ ghi được: container tự tải model bàn tay / YOLO và xuất model laser vào đây ở lần chạy đầu
      - ../models:/models
      - certs:/app/data/certs
      - ${UPLOAD_HOST_DIR:-../uploads}:/data/uploads
    restart: unless-stopped

volumes:
  certs:
    name: virtual-cam-certs

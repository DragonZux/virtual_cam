# HICAS bằng Docker trên PC có GPU NVIDIA — 3 image / container, chạy ở thư mục gốc:
#   docker compose up -d --build
#   https://localhost:8033  hoặc  https://<IP máy>:8033 từ máy khác trong mạng (giao diện hicascam)
#   https://<IP máy>:8033/view3d/  màn hình 3D (hicas3d: hiện mô hình 3D của vật thể đang chọn)
#   (chứng chỉ tự ký: lần đầu chọn Nâng cao › Tiếp tục)
# - backend : API + mô hình AI trên GPU, chỉ trong mạng Docker (không mở cổng)
# - frontend: nginx, cổng HTTPS duy nhất; chuyển /api (cả WebSocket) sang backend, /view3d/ sang view3d
# - view3d  : nginx phục vụ màn hình 3D
# Cần NVIDIA driver ≥ 570 + Docker Desktop có WSL2 GPU (Windows) hoặc NVIDIA Container Toolkit (Linux).
# Tuỳ chọn trong .env ở thư mục gốc (xem .env.example): WEB_PORT, YOLO_MODEL, IMAGE_SIZE…
# Lần chạy đầu backend tự tải model còn thiếu vào models/ (docker/init_models.py).
name: hicas-cam
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        - TORCH_INDEX=${TORCH_INDEX:-cu128}
    image: hicas-cam-backend:latest
    container_name: hicas-cam-backend
    environment:
      # Model YOLO (file trong models/) và cạnh ảnh đưa vào YOLO (640 chính xác nhất; 480 / 320 nhanh hơn)
      YOLO_MODEL: ${YOLO_MODEL:-yolo26m-seg.pt}
      IMAGE_SIZE: ${IMAGE_SIZE:-640}
      LASER_MODEL: ${LASER_MODEL:-laser-advr-yolov5l6.torchscript}
      LASER_IMAGE_SIZE: ${LASER_IMAGE_SIZE:-1280}
      LASER_CONFIDENCE: ${LASER_CONFIDENCE:-0.55}
      LASER_CROP_SIZE: ${LASER_CROP_SIZE:-384}
      MAX_MODEL_MB: ${MAX_MODEL_MB:-1024}
    volumes:
      # models/ ghi được: backend tự tải model YOLO / bàn tay và xuất model laser vào đây ở lần chạy đầu
      - ./models:/models
      # Cấu hình máy chủ (máy đích TCP socket trong Cài đặt) — dùng chung với khi chạy không Docker
      - ./backend/data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: hicas-cam-frontend:latest
    container_name: hicas-cam-frontend
    environment:
      # Không bắt buộc: IP / tên máy host ghi thêm vào chứng chỉ HTTPS, cách nhau dấu phẩy (vd 10.0.10.62)
      CERT_HOSTS: ${CERT_HOSTS:-}
    ports:
      # Một cổng HTTPS mở trên mọi IP của máy (giống các dự án khác)
      - "${WEB_PORT:-8033}:8443"
    volumes:
      # Giữ chứng chỉ qua các lần tạo lại container (trình duyệt không phải xác nhận lại)
      - certs:/etc/nginx/certs
    depends_on:
      - backend
      - view3d
    restart: unless-stopped

  view3d:
    build: ./view3d
    image: hicas-cam-view3d:latest
    container_name: hicas-cam-view3d
    restart: unless-stopped

volumes:
  certs:
    name: hicas-certs
